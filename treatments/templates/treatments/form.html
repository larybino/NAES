{% extends "website/base.html" %}
{% load static %}
{% load crispy_forms_tags %}
 
 {% block content %}
<div class="container mt-5">
  <h2>{{ view.title }}</h2>
  <div class="mb-3">
    <form method="post">
      {% csrf_token %} {{ form|crispy }} {%if view.button == "Sim, excluir"%}
      <button type="submit" class="btn btn-danger">{{ view.button }}</button>
      {% else %}
      <button type="submit" class="btn btn-primary">{{ view.button }}</button>
      {% endif %}
    </form>
  </div>
</div>

{% endblock %}
