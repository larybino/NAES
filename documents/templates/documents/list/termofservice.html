{% extends "website/base.html" %}

{% block hero %}
{% endblock hero %}

{% block content %}
<section class="py-5 py-lg-6 bg-surface">
  <div class="container">
    <h3 class="text-center border-bottom pb-2 mb-4">
        {{ title }}
      <span class="float-end">
        <a href="{% url 'termofservice-create' %}" class="btn btn-success btn-sm">
          <i class="bi bi-plus-lg"></i>
        </a>
      </span>
    </h3>
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            {% for term in object_list %}
            <tr>
              <td>{{ term.pk }}</td>
              <td>{{ term.nome }}</td>
              <td class="text-center">
                <div class="dropdown">
                  <a href="#" data-bs-toggle="dropdown">
                    <i class="bi bi-three-dots-vertical"></i>
                  </a>
                  <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="{% url 'termofservice-detail' term.pk %}"><i class="bi bi-zoom-in me-2"></i>View</a></li>
                    <li><a class="dropdown-item" href="{% url 'termofservice-update' term.pk %}"><i class="bi bi-pencil-square text-primary me-2"></i>Edit</a></li>
                    <li><a class="dropdown-item" href="{% url 'termofservice-delete' term.pk %}"><i class="bi bi-trash text-danger me-2"></i>Delete</a></li>
                  </ul>
                </div>
              </td>
            </tr>
            {% empty %}
            <tr>
              <td colspan="100%" class="text-center">Nenhum registro encontrado.</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
{% endblock content %}
