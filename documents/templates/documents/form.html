{% extends "website/base.html" %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <h2>{{ view.title }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">{{ view.button }}</button>
    </form>
</div>

{% endblock %}
