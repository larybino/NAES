{% extends 'website/base.html' %}
{% block title %}Configuracao de IA{% endblock %}
{% block content %}
<section class="py-5"><div class="container"><div class="row justify-content-center"><div class="col-xl-8">
  <span class="section-label">Administracao</span><h1>Configuracao de IA</h1><p class="text-secondary">A chave fica armazenada no servidor e nunca e exibida nas telas.</p>
  <form method="post" class="card card-body shadow-sm">{% csrf_token %}{{ form|crispy }}<div class="d-flex gap-2"><button class="btn btn-primary" type="submit"><i class="bi bi-check2 me-1"></i>Salvar configuracao</button><button class="btn btn-outline-secondary" name="action" value="test" type="submit"><i class="bi bi-plug me-1"></i>Testar conexao</button></div></form>
</div></div></div></section>
{% endblock %}
