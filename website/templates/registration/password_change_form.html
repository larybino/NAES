{% extends "website/base.html" %} {% load crispy_forms_tags %} {% block content
%}
<section class="py-5 py-lg-6 bg-surface">
  <div class="container">
    <h2 class="text-center border-bottom pb-2 mb-4">Alterar Senha</h2>
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <form method="post" class="btnLoading card p-4 shadow-sm">
          {% csrf_token %} {{ form|crispy }}
          <button type="submit" class="btn btn-primary w-100 mt-2">
            Salvar nova senha
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock content %}
