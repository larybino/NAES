{% extends "website/base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5">
    <h2>{{ view.title }}</h2>
    <form method="post">
        <div class="mb-3">
             {% csrf_token %}
             {{ form|crispy }}
             <button type="submit" class="btn btn-primary">{{ view.button }}</button>
        </div>
    </form>
</div>

{% endblock %}
