{% extends "website/base.html" %}

{% block hero %}
{% endblock hero %}

{% block content %}
<section class="py-5 py-lg-6 bg-surface">
  <div class="container">
    <h3 class="text-center border-bottom pb-2 mb-4">{{ title }}</h3>

    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <p class="mb-0 fs-5"><strong>{{ object.nome }}</strong></p>
            <hr>
            <p class="mb-2"><strong>Birth Date:</strong> {{ object.birth_date|date:"d/m/Y" }}</p>
            <p class="mb-2"><strong>Registered by:</strong> {{ object.created_by.username }}</p>
            <p class="text-muted mb-0">ID: {{ object.pk }}</p>
          </div>
          <div class="card-footer text-center">
            <a href="#" class="btn btn-outline-secondary" onclick="window.history.back()">
              <i class="bi bi-arrow-left me-2"></i>
              Back
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock content %}
